<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORVEX | Iniciar sesión</title>
    <link rel="stylesheet" href="/login.css">
</head>
<body>

    <main class="contenedor-login">

        <div class="logo">FOR<span>VEX</span></div>

        <h1>INICIAR SESIÓN</h1>
        <p>Entra a la competencia.</p>

        <form id="form-login">

            <label for="correo">Correo electrónico</label>
            <input
                type="email"
                id="correo"
                placeholder="Tu correo"
                required
            >

            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                placeholder="Tu contraseña"
                required
            >

            <button type="submit">ENTRAR</button>

            <p id="mensaje-login"></p>

        </form>

        <p class="enlace-registro">
            ¿No tienes cuenta?
            <a href="/registro">Regístrate</a>
        </p>

        <a class="volver" href="/">Volver al inicio</a>

    </main>

        <footer class="pie-pagina">
        <div class="pie-contenido">

            <h2>FOR<span>VEX</span></h2>

            <p>La competencia comienza aquí.</p>

            <div class="redes-sociales">
                <a href="https://www.youtube.com/@forvex.23" target="_blank">YouTube</a>

                <a href="https://www.tiktok.com/@forvex.23" target="_blank">TikTok</a>

                <a href="https://www.facebook.com/forvex.23/" target="_blank">Facebook</a>
            </div>

        </div>

        <div class="copyright">
            <p>© 2026 FORVEX. Todos los derechos reservados.</p>
            <p>Plataforma de torneos gamer.</p>
        </div>
    </footer>

    <script src="/js/login.js"></script>
</body>
</html>
