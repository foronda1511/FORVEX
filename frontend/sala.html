
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORVEX | Sala del torneo</title>
    <link rel="stylesheet" href="sala.css">
</head>
<body>

    <header class="encabezado">
        <h1>FOR<span>VEX</span></h1>
        <a href="/">VOLVER A TORNEOS</a>
    </header>

    <main class="contenedor-sala">
        <div class="etiqueta">INSCRIPCIÓN CONFIRMADA</div>

        <h2>SALA DEL TORNEO</h2>
        <p class="descripcion">Aquí encontrarás los datos para ingresar a tu partida.</p>

        <section class="datos-sala">
            <div class="dato">
                <label>ID DE LA SALA</label>
                <div class="dato-copiar">
                    <span id="sala-id">Cargando...</span>
                    <button id="copiar-id">COPIAR</button>
                </div>
            </div>

            <div class="dato">
                <label>CONTRASEÑA</label>
                <div class="dato-copiar">
                    <span id="sala-password">Cargando...</span>
                    <button id="copiar-password">COPIAR</button>
                </div>
            </div>
        </section>

        <p id="mensaje-sala"></p>
    </main>

    
    <footer class="pie-pagina">
        <div class="pie-contenido">

            <h2>FOR<span>VEX</span></h2>

            <p>La competencia comienza aquí.</p>

            <div class="redes-sociales">
                <a href="https://www.youtube.com/@forvex.23" target="_blank">YouTube</a>

                <a href="https://www.tiktok.com/@forvex.23" target="_blank">TikTok</a>

                <a href="https://www.facebook.com/forvex.23/" target="_blank">Facebook</a>
            </div>

        </div>

        <div class="copyright">
            <p>© 2026 FORVEX. Todos los derechos reservados.</p>
            <p>Plataforma de torneos gamer.</p>
        </div>
    </footer>


    <script src="sala.js"></script>
</body>
</html>
